server {
    server_name ivanpopov.pro;

    root /var/www/ivanpopov.pro;
    index index.html;

    # --- Compression (cheap perf win for text assets) ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/vnd.ms-fontobject
        font/ttf
        font/woff
        font/woff2;

    # nginx emits ETag + Last-Modified for static files by default,
    # so every "revalidate" below resolves to a tiny 304, not a full re-download.

    # --- HTML: never trust the cache, always revalidate ---
    # It's the manifest that references every other asset, so it must be fresh
    # for a deploy to be picked up. 304 keeps this nearly free.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # --- Versioned/immutable assets: cache hard for a year ---
    # CSS/JS carry a content-hash ?v= query in index.html, so a change ships a
    # new URL; images are stable and effectively immutable.
    # Either way the cached copy can never go stale -> skip revalidation entirely.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ivanpopov.pro-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ivanpopov.pro-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name ivanpopov.pro;
    return 301 https://$host$request_uri;
}
