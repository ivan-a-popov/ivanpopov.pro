# Per-platform OG image: WhatsApp and Telegram render the square photo as a
# compact thumbnail beside the text (portrait/wide sources get center-cropped
# and cut the head off), while everyone else (Facebook, X, LinkedIn)
# keeps the wide 1200x630 cover. UA-based swap is the only reliable
# per-platform mechanism — all crawlers read the same og:image tag.
# Telegram's media servers cannot reach this host (in-transit filtering of
# Telegram DC traffic; page fetches pass, image fetches never arrive), so
# TelegramBot gets the same square photo from the GitHub mirror of this repo.
map $http_user_agent $og_share_image {
    default          "https://ivanpopov.pro/static/img/about/og-cover-1200x630.jpg";
    ~*whatsapp       "https://ivanpopov.pro/static/img/about/og-image-square.jpg";
    ~*telegrambot    "https://raw.githubusercontent.com/ivan-a-popov/ivanpopov.pro/master/static/img/about/og-image-square.jpg";
}
map $http_user_agent $og_share_w {
    default                     "1200";
    ~*(whatsapp|telegrambot)    "600";
}
map $http_user_agent $og_share_h {
    default                     "630";
    ~*(whatsapp|telegrambot)    "600";
}
# The full og:image URL in index.html, replaced per-crawler by $og_share_image.
# (twitter:image carries the same URL and is swapped by the same rule.)

# Link-preview crawlers. X/Twitterbot fetches a shared URL exactly once and
# does NOT follow redirects: if its crawl hits http:// and gets a 301, X
# caches "no card" for that URL indefinitely. Crawlers get the real page over
# plain http; humans are still redirected to https.
map $http_user_agent $social_crawler {
    default 0;
    ~*(facebookexternalhit|facebot|whatsapp|telegrambot|twitterbot|linkedinbot|slackbot|discordbot|vkshare|skypeuripreview) 1;
}

server {
    server_name ivanpopov.pro;

    root /var/www/ivanpopov.pro;
    index index.html;

    # --- Compression (cheap perf win for text assets) ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/vnd.ms-fontobject
        font/ttf
        font/woff
        font/woff2;

    # nginx emits ETag + Last-Modified for static files by default,
    # so every "revalidate" below resolves to a tiny 304, not a full re-download.

    # --- HTML: never trust the cache, always revalidate ---
    # It's the manifest that references every other asset, so it must be fresh
    # for a deploy to be picked up. 304 keeps this nearly free.
    # LCP portraits as Link headers so Chrome can start them at TTFB. The
    # matching <link rel=preload> in <head> is only seen after this ~28 KB
    # HTML body arrives; on HTTP/1.1 Lighthouse counts that wait as a ~2 s
    # "resource load delay" even when the preloader is skipped. nopush:
    # do not HTTP/2-push (deprecated; would contend with the HTML stream).
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Link "</static/img/about/ip-foto-mobile.webp>; rel=preload; as=image; fetchpriority=high; media=\"(max-width: 639px)\"; nopush" always;
        add_header Link "</static/img/about/ip-foto.webp>; rel=preload; as=image; fetchpriority=high; media=\"(min-width: 640px)\"; nopush" always;
        sub_filter 'https://ivanpopov.pro/static/img/about/og-cover-1200x630.jpg' '$og_share_image';
        sub_filter '<meta property="og:image:width" content="1200" />' '<meta property="og:image:width" content="$og_share_w" />';
        sub_filter '<meta property="og:image:height" content="630" />' '<meta property="og:image:height" content="$og_share_h" />';
        sub_filter_once off;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Link "</static/img/about/ip-foto-mobile.webp>; rel=preload; as=image; fetchpriority=high; media=\"(max-width: 639px)\"; nopush" always;
        add_header Link "</static/img/about/ip-foto.webp>; rel=preload; as=image; fetchpriority=high; media=\"(min-width: 640px)\"; nopush" always;
        sub_filter 'https://ivanpopov.pro/static/img/about/og-cover-1200x630.jpg' '$og_share_image';
        sub_filter '<meta property="og:image:width" content="1200" />' '<meta property="og:image:width" content="$og_share_w" />';
        sub_filter '<meta property="og:image:height" content="630" />' '<meta property="og:image:height" content="$og_share_h" />';
        sub_filter_once off;
    }

    # --- Versioned/immutable assets: cache hard for a year ---
    # CSS/JS carry a content-hash ?v= query in index.html, so a change ships a
    # new URL; images are stable and effectively immutable.
    # Either way the cached copy can never go stale -> skip revalidation entirely.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log /var/log/nginx/ivanpopov-assets.log main;
        try_files $uri =404;
    }

    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/ivanpopov.pro-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ivanpopov.pro-0001/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name ivanpopov.pro;

    root /var/www/ivanpopov.pro;
    index index.html;

    if ($social_crawler = 0) {
        return 301 https://$host$request_uri;
    }

    location = / {
        try_files /index.html =404;
        sub_filter 'https://ivanpopov.pro/static/img/about/og-cover-1200x630.jpg' '$og_share_image';
        sub_filter '<meta property="og:image:width" content="1200" />' '<meta property="og:image:width" content="$og_share_w" />';
        sub_filter '<meta property="og:image:height" content="630" />' '<meta property="og:image:height" content="$og_share_h" />';
        sub_filter_once off;
    }
}
